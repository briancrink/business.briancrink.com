<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="../resources/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="../resources/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="../resources/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="../resources/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <title>Business Startup | Brian Crink</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 70px 20px;
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      line-height: 1.6;
      transition: background 0.4s, color 0.4s;
      opacity: 0;
      animation: fadeIn 1.3s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .container {
      position: relative;
      max-width: 620px;
      width: 100%;
      text-align: center;
      margin-top: 24px;
    }

    .venture-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .venture-group {
      width: 100%;
    }

    @media (min-width: 950px) {
      .container {
        max-width: 1400px;
      }

      .venture-row {
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        gap:5.50rem;
      }

      .venture-group {
        width: auto;
        min-width: 220px;
      }
    }

    @property --pc1 { syntax: '<color>'; inherits: false; initial-value: #ff006e; }
    @property --pc2 { syntax: '<color>'; inherits: false; initial-value: #8338ec; }
    @property --pc3 { syntax: '<color>'; inherits: false; initial-value: #3a86ff; }
    @property --pc4 { syntax: '<color>'; inherits: false; initial-value: #06d6a0; }
    @property --pc5 { syntax: '<color>'; inherits: false; initial-value: #ffbe0b; }

    @keyframes portalChromaFade {
      0%   { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
      20%  { --pc1: #ffbe0b; --pc2: #ff006e; --pc3: #8338ec; --pc4: #3a86ff; --pc5: #06d6a0; }
      40%  { --pc1: #06d6a0; --pc2: #ffbe0b; --pc3: #ff006e; --pc4: #8338ec; --pc5: #3a86ff; }
      60%  { --pc1: #3a86ff; --pc2: #06d6a0; --pc3: #ffbe0b; --pc4: #ff006e; --pc5: #8338ec; }
      80%  { --pc1: #8338ec; --pc2: #3a86ff; --pc3: #06d6a0; --pc4: #ffbe0b; --pc5: #ff006e; }
      100% { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
    }

    .site-nav-link.portal {
      background-image: linear-gradient(
        90deg,
        var(--pc1),
        var(--pc2),
        var(--pc3),
        var(--pc4),
        var(--pc5)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: portalChromaFade 8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .site-nav-link.portal {
        animation: none;
      }
    }

    .site-nav {
      margin: 0;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      letter-spacing: 0.16rem;
    }

    body.light .site-nav {
      color: #1a1a1a;
    }

    .site-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin: 0;
    }

    .site-nav .portal {
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.08rem;
    }

    .site-nav-link.business {
      color: #ffb04a;
      -webkit-text-fill-color: #ffb04a;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04rem;
    }

    .site-nav-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .site-nav-link:hover {
      opacity: 0.85;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: inherit;
      text-decoration: none;
      line-height: 0;
    }

    .map-link:hover {
      opacity: 0.85;
    }

    .map-icon {
      width: 3.0rem;
      height: 3.0rem;
      display: block;
    }

    .name {
      font-size: 3.0rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 15px 0;
      letter-spacing: -0.5px;
    }

    body.light .name {
      color: #1a1a1a;
    }

    .name-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .name-link:hover {
      opacity: 0.85;
    }

    h2 {
      font-size: 1.5rem;
      margin: 40px 0 20px;
      font-weight: 600;
      white-space: nowrap;
    }

    .icons {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .icon img {
      width: 100px;
      height: 100px;
      transition: transform 0.2s;
    }

    @media (max-width: 949px) {
      body {
        padding: 28px 20px 24px;
      }

      .container {
        margin-top: 8px;
      }

      .venture-group {
        margin-top: 8px;
        margin-bottom: 8px;
      }

      .venture-group h2 {
        margin: 10px 0 8px;
      }

      .venture-group .icons {
        margin-bottom: 8px;
      }

      .icon img {
        width: 50px;
        height: 50px;
      }

      .wordmark-link {
        min-height: 50px;
      }

      .wordmark {
        font-size: 1.1rem;
      }
    }

    .icon:hover img {
      transform: scale(1.15);
    }

    .wordmark-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s;
    }

    .wordmark-link:hover {
      opacity: 0.85;
      transform: scale(1.06);
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 0.02rem;
      line-height: 1.0;
      white-space: nowrap;
    }

    .wordmark-top,
    .wordmark-bottom {
      display: block;
    }

    .careeros-mark .career-word {
      color: #ab7affda;
    }

    .careeros-mark .os-mark {
      color: #ffffff;
    }

    .accessedu-mark .access-word {
      color: #3f8f4e;
    }

    .accessedu-mark .edu-word {
      color: #ffffff;
    }

    .store-mark .store-word {
      color: #ffffff;
    }

    .store-mark .bc-word {
      color: #b3b3b3;
    }

    body.light .careeros-mark .os-mark,
    body.light .accessedu-mark .edu-word,
    body.light .store-mark .store-word {
      color: #cecece;
    }

  body.light .accessedu-mark .access-word {
    color: #3f8f4e;
  }

    body.light .store-mark .bc-word {
      color: #222222;
    }

    .streamline-mark {
      align-items: center;
    }

    .streamline-mark img {
      width: 68px;
      height: 68px;
      display: block;
    }

    .streamline-mark .streamline-word {
      margin-top: 0.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02rem;
      line-height: 1;
    }

    .streamline-mark .stream-word {
      color: #ffb04a;
    }

    .streamline-mark .line-word {
      color: #ffffff;
    }

    body.light .streamline-mark .line-word {
      color: #1a1a1a;
    }

    @media (max-width: 949px) {
      .wordmark {
        font-size: 1.1rem;
      }

      .wordmark-link {
        min-height: 50px;
      }

      .streamline-mark img {
        width: 32px;
        height: 32px;
      }

      .streamline-mark .streamline-word {
        font-size: 0.62rem;
        margin-top: 0.12rem;
      }
    }

    body.light { background: #ffffff; color: #1a1a1a; }
    body.light h2 { color: #1a1a1a; }

    .toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: transparent;
      border: none;
      width: 48px;
      height: 48px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: transform 0.3s;
      margin: 0;
      display: block;
      color: #ffffff;
    }

    .toggle-btn:hover {
      transform: rotate(20deg);
    }

    body.light .toggle-btn {
      color: #1a1a1a;
    }

    .toggle-btn svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    @media (max-width: 768px) {
      .toggle-btn {
        top: 16px;
        right: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="toggle-btn" id="theme-toggle" type="button" aria-label="Dark mode">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.15"/><line x1="12" y1="2.4" x2="12" y2="5.1"/><line x1="12" y1="18.9" x2="12" y2="21.6"/><line x1="2.4" y1="12" x2="5.1" y2="12"/><line x1="18.9" y1="12" x2="21.6" y2="12"/><line x1="5.2" y1="5.2" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="5.2" y2="18.8"/></svg>
    </button>

    <div class="site-nav">
      <p class="site-link">
        <a href="https://portal.briancrink.com" class="site-nav-link portal">Portal</a>
        <a href="https://site.briancrink.com/map" class="map-link" aria-label="Site map"><svg class="map-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <clipPath id="mapFillPortal"><path d="M3.15 7.85 L8.85 4.55 L15.05 8.05 L20.7 4.75 L20.7 16.25 L15.05 19.55 L8.85 16.05 L3.15 19.35 Z"/></clipPath>
              <g clip-path="url(#mapFillPortal)">
                <path d="M3.15 7.85 L8.85 4.55 L15.05 8.05 L20.7 4.75 L20.7 16.25 L15.05 19.55 L8.85 16.05 L3.15 19.35 Z" fill="#3f8f4e"/>
                <path d="M3.15 19.35 C 8.85 11.05, 15.05 13.8, 20.7 8.75 V 14.65 C 18.9 15.9, 16.15 18.4, 14.85 19.35 L 3.15 19.35 Z" fill="#3a86ff"/>
              </g>
              <path d="M3.15 7.85 L8.85 4.55 L15.05 8.05 L20.7 4.75 L20.7 16.25 L15.05 19.55 L8.85 16.05 L3.15 19.35 Z" fill="none" stroke="rgba(47, 58, 51, 0.32)" stroke-width="0.85"/>
              <line x1="8.85" y1="6.2" x2="8.85" y2="14.4" stroke="rgba(255,255,255,0.62)" stroke-width="0.36" stroke-linecap="round" stroke-dasharray="0.42 2.25"/>
              <line x1="15.05" y1="9.7" x2="15.05" y2="17.9" stroke="rgba(255,255,255,0.62)" stroke-width="0.36" stroke-linecap="round" stroke-dasharray="0.42 2.25"/>
              <g class="map-compass">
                <circle cx="6.114" cy="14.75" r="2.38" fill="#ffffff" stroke="#2eb5e8" stroke-width="0.58"/>
                <circle cx="6.114" cy="14.75" r="2.07" fill="none" stroke="#1b94d0" stroke-width="0.16"/>
                <line x1="6.114" y1="13.02" x2="6.114" y2="12.68" stroke="#9ecce4" stroke-width="0.22" stroke-linecap="round"/>
                <line x1="6.114" y1="16.48" x2="6.114" y2="16.82" stroke="#9ecce4" stroke-width="0.22" stroke-linecap="round"/>
                <line x1="4.384" y1="14.75" x2="4.044" y2="14.75" stroke="#9ecce4" stroke-width="0.22" stroke-linecap="round"/>
                <line x1="7.844" y1="14.75" x2="8.184" y2="14.75" stroke="#9ecce4" stroke-width="0.22" stroke-linecap="round"/>
                <path d="M7.259 13.605 L5.605 14.241 L6.623 15.259 Z" fill="#ef4a3c"/>
                <path d="M4.969 15.895 L5.605 14.241 L6.623 15.259 Z" fill="#33b7e8"/>
                <circle cx="6.114" cy="14.75" r="0.46" fill="#ffffff"/>
              </g>
              <line x1="19.545" y1="13.689" x2="22.395" y2="16.539" stroke="#e0b36a" stroke-width="1.85" stroke-linecap="round"/>
              <circle cx="16.858" cy="11.002" r="2.85" fill="rgba(90, 190, 255, 0.38)" stroke="#8b9098" stroke-width="0.82"/>
            </svg></a>
        <a href="https://portal.briancrink.com#boss" class="site-nav-link business">Business</a>
      </p>
    </div>

    <h1 class="name"><a href="https://briancrink.com" class="name-link">Brian Crink</a></h1>

    <div class="venture-row">
      <section class="venture-group">
        <h2>Software</h2>
        <div class="icons">
          <a href="https://business.briancrink.com/accessedu" class="icon wordmark-link accessedu-link" aria-label="Access.Edu">
            <span class="wordmark accessedu-mark">
              <span class="wordmark-top access-word">Learn</span>
              <span class="wordmark-bottom edu-word">OS</span>
            </span>
          </a>
          <a href="https://business.briancrink.com/careeros" class="icon wordmark-link careeros-link" aria-label="CareerOS">
            <span class="wordmark careeros-mark">
              <span class="wordmark-top career-word">Career</span>
              <span class="wordmark-bottom os-mark">OS</span>
            </span>
          </a>
          <a href="https://business.briancrink.com/streamline" class="icon wordmark-link streamline-link"
             data-light="../resources/images/icons/dark/streamline.png"
             data-dark="../resources/images/icons/light/streamline.png"
             aria-label="Streamline">
            <span class="wordmark streamline-mark">
              <img src="../resources/images/icons/color/streamline.png" alt="" width="68" height="68">
              <span class="streamline-word"><span class="stream-word">Stream</span><span class="line-word">line</span></span>
            </span>
          </a>
        </div>
      </section>

      <section class="venture-group">
        <h2>Commerce</h2>
        <div class="icons">
          <a href="https://store.briancrink.com" class="icon wordmark-link store-link" aria-label="Store bc">
            <span class="wordmark store-mark">
              <span class="wordmark-top bc-word">briancrink.com</span>
              <span class="wordmark-bottom store-word">Store</span>
            </span>
          </a>
        </div>
      </section>

      <section class="venture-group">
        <h2>Lifestyle</h2>
        <div class="icons">
          <a href="https://business.briancrink.com/tinyspace" class="icon"
             data-light="../resources/images/icons/color/tinyspace.png"
             data-dark="../resources/images/icons/color/tinyspace.png">
            <img src="../resources/images/icons/color/tinyspace.png" alt="Tiny Space" width="55" height="55">
          </a>
        </div>
      </section>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;

    const sunIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.15"/><line x1="12" y1="2.4" x2="12" y2="5.1"/><line x1="12" y1="18.9" x2="12" y2="21.6"/><line x1="2.4" y1="12" x2="5.1" y2="12"/><line x1="18.9" y1="12" x2="21.6" y2="12"/><line x1="5.2" y1="5.2" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="5.2" y2="18.8"/></svg>`;
    const moonIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.35A9 9 0 1 1 9.65 3 7.15 7.15 0 0 0 21 14.35z"/></svg>`;

    function setToggleIcon() {
      const isLight = body.classList.contains('light');
      toggleBtn.innerHTML = isLight ? moonIcon : sunIcon;
      toggleBtn.setAttribute('aria-label', isLight ? 'Dark mode' : 'Light mode');
    }

    function updateSocialIcons() {
      const isLight = body.classList.contains('light');
      const mode = isLight ? 'light' : 'dark';
      document.querySelectorAll('.icon').forEach(icon => {
        const img = icon.querySelector('img');
        const newSrc = icon.getAttribute(`data-${mode}`);
        if (newSrc && img) img.src = newSrc;
      });
    }

    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('light');
      setToggleIcon();
      updateSocialIcons();
    });

    setToggleIcon();
    updateSocialIcons();
  </script>
</body>
</html>
